# Fallback example values used by CoolCast for development and tests.
# In the app, the tariff comes from the user's own bill and the emission factor
# from their location. Every value here is an assumption, not a measurement.
# Explanations: docs/assumptions.md

[tariff]
value = 8.0
unit = "₹/kWh"
source = "Example value for the Indian development site: typical commercial tariff (₹7-10/kWh). Real runs use the price from the user's bill."
label = "assumed"

[emission_factor]
value = 0.675
unit = "kg CO2/kWh"
source = "CEA CO2 Baseline Database for the Indian Power Sector, version 22.0 (FY 2025-26), weighted average grid emission factor (0.675 tCO2/MWh)."
label = "assumed"
