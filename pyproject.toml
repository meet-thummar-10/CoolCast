[project]
name = "coolcast"
version = "0.1.0"
description = "Find where your data centre wastes energy, and how to cut its cost"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit rule set so every ruff version checks the same things:
# ruff's classic defaults (E4, E7, E9, F) plus import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
